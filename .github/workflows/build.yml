name: Build Model

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_URL }}
  MLFLOW_URL: ${{ vars.MLFLOW_URL }}
  EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
  MODEL_NAME: ${{ vars.MODEL_NAME }}
  MODEL_ALIAS: ${{ vars.MODEL_ALIAS }}
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

jobs:
  build-model:
    name: build-model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Adult dataset
        run: |
          mkdir -p data/raw
          curl -L --retry 3 -o data/raw/adult.data https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data
          curl -L --retry 3 -o data/raw/adult.test https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.test
          test -s data/raw/adult.data
          test -s data/raw/adult.test

      - name: Train and save model
        env:
          PYTHONPATH: .
        run: python src/main.py

      - name: Save RUN_ID for later steps
        run: |
          echo "RUN_ID=$(cat run_id.txt)" >> "$GITHUB_ENV"
          echo "Trained run_id: $(cat run_id.txt)"

      - name: Run model tests
        env:
          PYTHONPATH: .
        run: pytest model_tests/ -q

      - name: Register model in MLflow
        env:
          PYTHONPATH: .
          RUN_ID: ${{ env.RUN_ID }}
        run: python scripts/register_model.py

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-build-artifacts
          path: |
            run_id.txt
            training.log
            models/
