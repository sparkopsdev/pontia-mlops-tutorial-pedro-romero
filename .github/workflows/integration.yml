name: Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests and save logs
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          mkdir -p test-results
          pytest tests/ --capture=tee-sys --cov=src --cov-report=term --cov-report=html --junitxml=test-results/results.xml 2>&1 | tee test-results/results.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            htmlcov/

      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/results.log';
            const results = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No results.log found';
            const truncated = results.length > 60000 ? results.slice(0, 60000) + '\n...TRUNCATED...' : results;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Integration test results\n\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
